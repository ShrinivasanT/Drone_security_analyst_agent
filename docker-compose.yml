# Stage 0 skeleton: storage layer only (postgres + minio).
# `backend` is added in Stage 3 and `frontend` in Stage 8 once their Dockerfiles exist.

services:

  postgres:
    image: ankane/pgvector             # PostgreSQL 15 + pgvector pre-installed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  minio:
    image: minio/minio                 # S3-compatible object store
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API (boto3 endpoint)
      - "9001:9001"   # MinIO web console

  minio_init:
    image: minio/mc                    # one-shot: create bucket on startup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set download local/${MINIO_BUCKET}
      "

volumes:
  pg_data:
  minio_data:
