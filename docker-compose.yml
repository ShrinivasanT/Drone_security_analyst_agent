# Full stack: postgres + minio (storage), backend (FastAPI agent), frontend (React/nginx).

services:

  postgres:
    image: ankane/pgvector             # PostgreSQL 15 + pgvector pre-installed
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  minio:
    image: minio/minio                 # S3-compatible object store
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"   # S3 API (boto3 endpoint); host 9100 because another project already binds 9000
      - "9101:9001"   # MinIO web console at http://localhost:9101

  minio_init:
    image: minio/mc                    # one-shot: create bucket on startup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set download local/${MINIO_BUCKET}
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # In-network: backend reaches MinIO at the service name, not the host port.
      MINIO_ENDPOINT: http://minio:9000
      # Host-reachable; baked into stored blob_urls so the browser can render frames.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # LLM providers. Vision + reasoning run on Groq (OpenAI-compatible). OpenAI is used
      # for embeddings only, and for chat only if LLM_ALLOW_OPENAI_CHAT=true. Embeddings
      # fall back to a local hashing embedder when no OPENAI_API_KEY is present.
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_ALLOW_OPENAI_CHAT: ${LLM_ALLOW_OPENAI_CHAT:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VLM_MODEL: ${GROQ_VLM_MODEL:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      VLM_MODEL: ${VLM_MODEL:-}
      REASONING_MODEL: ${REASONING_MODEL:-}
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the backend (host-published port).
        VITE_API_BASE: ${FRONTEND_API_BASE:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
